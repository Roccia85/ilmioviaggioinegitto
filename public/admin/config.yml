# =====================================================================
# Sveltia CMS — configurazione del pannello /admin
# Sito statico: i contenuti sono file Markdown nel repo (nessun database).
# =====================================================================

backend:
  name: github
  repo: Roccia85/ilmioviaggioinegitto      # owner/repo del progetto
  branch: main                             # branch principale
  # URL del Cloudflare Worker "sveltia-cms-auth" (handshake OAuth con GitHub).
  # Formato: https://sveltia-cms-auth.<SOTTODOMINIO>.workers.dev
  # Da impostare UNA VOLTA dopo aver deployato il worker — vedi README (Guida OAuth).
  base_url: https://sveltia-cms-auth.SOTTODOMINIO.workers.dev

# Test in LOCALE senza OAuth: su http://localhost Sveltia usa la File System
# Access API del browser (Chrome/Edge) e chiede di selezionare la cartella del
# repo. In produzione (https) viene ignorato e si usa il backend GitHub.
local_backend: true

# ---- Media: dove Sveltia carica le immagini e con quale path pubblico ----
media_folder: public/uploads             # cartella nel repo
public_folder: /uploads                  # URL con cui Astro le serve

# ---- i18n: stesse lingue del sito (IT default, EN secondaria) ----
i18n:
  structure: multiple_folders            # src/content/articoli/<lang>/<slug>.md
  locales: [it, en]
  default_locale: it

collections:
  - name: articoli
    # Etichette bilingui: arabo · italiano (l'interfaccia di Sveltia resta in
    # inglese — sono localizzabili solo le label/hint dei campi, non la UI).
    label: "المقالات · Articoli"
    label_singular: "مقال · Articolo"
    description: "مدوّنة السفر — مقالات بالإيطالي والإنجليزي · Diario di viaggio (IT/EN)."
    folder: src/content/articoli
    create: true
    delete: true
    slug: "{{slug}}"                      # stesso slug per IT ed EN
    extension: md
    format: frontmatter
    i18n: true                            # collection bilingue
    summary: "{{title}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: "العنوان · Titolo", widget: string, i18n: true }
      - {
          name: date,
          label: "التاريخ · Data",
          widget: datetime,
          date_format: "YYYY-MM-DD",      # salva solo la data (ISO)
          time_format: false,            # niente orario
          picker_utc: true,
          i18n: duplicate,               # stessa data nelle due lingue
        }
      - {
          name: excerpt,
          label: "مقتطف · Estratto",
          widget: text,
          required: false,
          hint: "جملة قصيرة بتظهر في الكروت · Frase breve per le card di anteprima.",
          i18n: true,
        }
      - {
          name: cover,
          label: "صورة الغلاف · Copertina",
          widget: image,
          choose_url: true,
          hint: "صورة المقال الرئيسية · Immagine principale dell'articolo.",
          i18n: true,
        }
      - name: gallery
        label: "المعرض · Galleria"
        widget: list
        required: false
        label_singular: "صورة · Immagine"
        hint: "صور إضافية (اختياري) · Immagini aggiuntive (opzionale)."
        i18n: true
        field: { name: image, label: "صورة · Immagine", widget: image, choose_url: true }
      - {
          name: draft,
          label: "مسودة · Bozza",
          widget: boolean,
          default: false,
          hint: "لو مفعّلة، المقال مش هيتنشر · Se attivo, l'articolo NON viene pubblicato.",
          i18n: true,                    # stato bozza indipendente per lingua
        }
      - {
          name: body,
          label: "المحتوى · Contenuto",
          widget: markdown,
          i18n: true,
        }
